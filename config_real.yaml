# Real-data backtest: Binance BTC/USDT 1h, 2021-2024.
data:
  source: ccxt
  exchange: binance
  symbol: BTC/USDT
  timeframe: 1h
  start: "2021-01-01"
  end: "2024-01-01"
  cache_dir: data/cache

strategy:
  name: momentum
  params:
    fast: 24
    slow: 96
    breakout: 48
    atr_window: 14
    regime_window: 200
    allow_short: true

backtest:
  initial_capital: 10000
  fee_bps: 7.5
  slippage_bps: 2.0
  risk:
    risk_per_trade: 0.01
    atr_stop_mult: 3.0
    max_leverage: 1.0

evaluation:
  oos_fraction: 0.3
